[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyMicroglia"
description = "Microglial imaging analysis: registration, filtering, segmentation, tracing and figures, with a keyed artefact store"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dynamic = ["version"]
authors = [{ name = "Brancaccio Lab" }]
maintainers = [{ name = "Jay2owe" }]
keywords = ["microglia", "microscopy", "bioluminescence", "image-analysis", "circadian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# This package processes microscopy, so unlike analysis-kit it is allowed a
# scientific stack. Keep the required set to what the data layer genuinely needs
# and push everything else into an extra, so importing pymicroglia to read a
# parameter block does not pull in matplotlib.
dependencies = [
    # Required rather than an extra since 2026-08-24, when the longitudinal
    # machinery moved down: reading a file, opening a time-lapse, registering
    # it, removing cosmic rays and the keyed artefact store all live there now,
    # and this package's own modules of those names are shims onto them. It is
    # floored rather than pinned because the two are developed together.
    "Auto-Organotypic>=0.7.2,<0.8",
    "reprofig>=0.5.1",
    "numpy>=1.24",
    "tifffile>=2023.7",
    "scipy>=1.10",
    # Required since 2026-09-21 (Motion port, stage 03): the measure step
    # reaches both by default. pandas holds every table the chassis writes and
    # scikit-image is what the morphology modules measure outlines with.
    # Imported inside functions where a module is read by ``describe``, so
    # the package root still imports without them.
    "pandas>=2.0",
    "circadian-workbench>=0.9.8,<0.10",
    "scikit-image>=0.21",
    # The automatic Motion stage executes the isolated frozen engine bundled
    # in this wheel; these are its runtime dependencies.
    "Pillow>=10",
    "scikit-learn>=1.3,<2",
    "diptest>=0.11,<0.12",
    "arch>=8,<9",
]

[project.optional-dependencies]
states = ["scikit-learn>=1.3", "hmmlearn", "hdbscan", "threadpoolctl", "diptest", "tslearn>=0.9,<1"]
kit     = ["analysis-kit>=0.1.0"]
# The kit is listed here as well as under `kit`, and for a different reason.
# There it is the audit layer, which is soft: a missing run record costs a
# record. Here it is the house palette, and it is hard â€” pymicroglia's figure
# modules hold no colour table of their own and raise `FigureStyleMissing`
# rather than substituting anything, because drawing in the wrong colours is
# the drift the shared palette exists to stop.
# The accepted trace-panel review pixels were frozen with Matplotlib 3.9.2.
figure  = ["matplotlib==3.9.2", "analysis-kit>=0.1.0"]
seg     = ["scikit-image>=0.21"]
register = ["Auto-Organotypic[register]>=0.7.2,<0.8"]
# The learned single-frame mask. Torch is the network; scikit-image is the
# watershed that grows a seed into a cell. OpenCV is not listed and is not
# required: `learned_mask.filters` falls back to SciPy without it, and the only
# difference is that the same answer takes 1.6x longer. Add it yourself if that
# matters -- it is a large wheel to make anybody take for a speed-up.
mask    = ["torch>=2.0", "scikit-image>=0.21"]
video   = ["imageio-ffmpeg"]
# Floored, not pinned to one release: the workbench is being developed
# alongside this package. The moved adapter uses Circadian Workbench's public
# package-root facade only. If that contract changes, fix the adapter â€” never
# fork the implementation into this package.
# Keep the historical extra name, but use the already-required Workbench 0.9
# range. Auto-Organotypic's independent rhythm extra targets Workbench 0.8.
rhythm  = ["circadian-workbench>=0.9.8,<0.10"]
# The accepted automatic SCN outline. Floored, not pinned, for the same reason
# as the workbench above: it is developed alongside this package and
# scn_outline.py uses only its public surface. If one of those names moves, fix
# the delegate â€” never fork the implementation back into this package.
#
# Kept, and now redundant: Auto-Organotypic is a required dependency above, so this
# extra adds nothing. It stays declared because `pip install "PyMicroglia[scn]"`
# is in this package's README, in Auto-Organotypic's, and in the message
# ``scn_outline`` prints when the outline cannot resolve â€” and an extra that
# stops existing turns all three into a warning nobody reads.
scn     = ["Auto-Organotypic>=0.7.2,<0.8"]
test    = ["pytest>=8.0"]

[project.scripts]
pymicroglia = "pymicroglia.cli:main"

[project.urls]
Homepage = "https://github.com/Jay2owe/PyMicroglia"
Repository = "https://github.com/Jay2owe/PyMicroglia"
Issues = "https://github.com/Jay2owe/PyMicroglia/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
pymicroglia = ["data/*.json", "guide/*.md", "pymicroglia_context.json",
               "tracking/data/*.zip"]

[tool.setuptools.dynamic]
version = { attr = "pymicroglia.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
